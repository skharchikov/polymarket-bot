[package]
name = "admin"
version = "0.6.41"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "admin"
path = "src/main.rs"

[dependencies]
polymarket-common = { path = "../common" }

tokio = { version = "1.50", features = ["full"] }
axum = "0.8"
askama = "0.14"
tower-http = { version = "0.6", features = ["catch-panic", "trace"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json"] }
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
chrono = { version = "0.4.44", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
confique = "0.4"
dotenvy = "0.15"
rustls = { version = "0.23", features = ["ring"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
