services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: polymarket
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d polymarket"]
      interval: 5s
      timeout: 3s
      retries: 5

  model-server:
    build:
      context: scripts
    command: ["serve_model.py"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bot:bot@postgres:5432/polymarket
      MODEL_DIR: /model
      MODEL_PORT: "8000"
      RETRAIN_MAX_AGE_HOURS: "24"
      RETRAIN_ON_SCHEDULE: "true"
      RETRAIN_MARKETS: "3000"
    volumes:
      - model:/model
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  bot:
    image: ghcr.io/skharchikov/polymarket-bot:latest
    depends_on:
      postgres:
        condition: service_healthy
      model-server:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://bot:bot@postgres:5432/polymarket
      MODEL_SIDECAR_URL: http://model-server:8000
      METRICS_PORT: "9000"
    volumes:
      - model:/app/model
    # Metrics port bound to localhost only — Prometheus scrapes it over the
    # internal Docker network (bot:9000), so it must not be exposed publicly.
    ports:
      - "127.0.0.1:9000:9000"
    stop_grace_period: 15s
    restart: unless-stopped

  copy-trading-bot:
    image: ghcr.io/skharchikov/polymarket-bot-copy:latest
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://bot:bot@postgres:5432/polymarket
      TELEGRAM_BOT_TOKEN: ${COPY_TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${COPY_TELEGRAM_CHAT_ID}
      METRICS_PORT: "9001"
    # Localhost-only; not scraped externally (Prometheus reaches it internally
    # if added as a target). Must not be exposed to the public internet.
    ports:
      - "127.0.0.1:9001:9001"
    stop_grace_period: 15s
    restart: unless-stopped

  admin:
    image: ghcr.io/skharchikov/polymarket-bot-admin:latest
    depends_on:
      postgres:
        condition: service_healthy
    # Deliberately no env_file: the admin gets only these variables, so bot
    # secrets (Telegram tokens, OpenAI key) never enter this container.
    environment:
      ADMIN_DB_URL: postgres://admin_ro:${ADMIN_RO_PASSWORD:?set ADMIN_RO_PASSWORD in .env}@postgres:5432/polymarket
      ADMIN_TAILSCALE_LOGIN: ${ADMIN_TAILSCALE_LOGIN:?set ADMIN_TAILSCALE_LOGIN in .env}
      MODEL_SIDECAR_URL: http://model-server:8000
    # Loopback only; reached through `tailscale serve --https=443`.
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.10.0
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # No host port: Grafana reaches it as prometheus:9090 on the compose network.
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.1
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Only applied on a fresh volume; the live password is managed in the UI.
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-http://localhost:3000/}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    # Loopback only; reached through `tailscale serve --https=8443`.
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
  model:
  prometheus_data:
  grafana_data:
